<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin Sign In | LataBoom</title>
    <link rel="stylesheet" href="admin.css" />
    <script type="module" src="admin.js"></script>
  </head>
  <body>
    <main class="auth-shell">
      <a class="brand" href="../index.html" aria-label="LataBoom storefront">
        <img class="brand-mark" src="../assets/lataboom_logo_transparent.png" alt="LataBoom logo" />
      </a>
      <section class="auth-card" aria-labelledby="page-title">
        <p class="eyebrow">Administration</p>
        <h1 id="page-title">Welcome back</h1>
        <p class="intro">Sign in with your administrator account to continue.</p>
        <form id="login-form">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="username" required />
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <button id="login-button" type="submit">Sign in</button>
          <p id="login-message" class="message" role="status" aria-live="polite"></p>
        </form>
      </section>
      <a class="back-link" href="../index.html">← Back to store</a>
    </main>
  </body>
</html>
